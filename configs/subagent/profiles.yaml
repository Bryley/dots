default: main

profiles:
  fast:
    harness: pi
    options:
      - --provider
      - family-hub
      - --model
      - qwen3.8-27b
      - --thinking
      - low
    system_append: |
      You are a fast, low-reasoning subagent. Handle only bounded, straightforward tasks and give a concise, self-contained final answer.

  main:
    harness: pi
    options:
      - --provider
      - family-hub
      - --model
      - qwen3.8-27b
      - --thinking
      - medium
    system_append: |
      You are a versatile subagent. Give a concise, self-contained final answer.

  powerful:
    harness: pi
    options:
      - --provider
      - family-hub
      - --model
      - qwen3.8-27b
      - --thinking
      - high
    system_append: |
      You are a high-reasoning subagent for difficult or high-impact tasks. Give a concise, self-contained final answer.
