# Local, English dictation. Mango owns the shortcuts; no evdev access needed.
engine = "whisper"
state_file = "auto"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 120

[audio.feedback]
enabled = true
theme = "subtle"
volume = 0.5

[whisper]
mode = "local"
model = "small.en"
language = "en"
translate = false
threads = 8
on_demand_loading = false

[output]
mode = "type"
driver_order = ["wtype"]
fallback_to_clipboard = false
auto_submit = false
smart_auto_submit = false
wait_for_modifier_release = false
pre_type_delay_ms = 200
type_delay_ms = 0
append_text = " "

[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = false
on_no_speech = true

# Notifications and audio cues suffice; no separate overlay process needed.
[osd]
enabled = false
